# ============================================================
# 中兴U30Pro随身WiFi充值提醒（个人事务群 7debbcf9）
# 每月充值日 6 号；3号(提前3天)/5号(提前1天)/6号(当天) 各推一次
# cron UTC 0 1 * * * = 北京 09:00（每天跑，脚本内判断提醒日）
# ============================================================
name: 中兴随身WiFi充值提醒

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "模拟日期 YYYY-MM-DD（留空=今天）"
        required: false
        default: ""

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 早上9点 - 推送中兴随身WiFi充值提醒
        env:
          TZ: Asia/Shanghai
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python3 zte_reminder.py --date "${{ inputs.date }}"
          else
            python3 zte_reminder.py
          fi
