# ============================================================
# 京汉九年级4班 每日课程与作息提醒 - GitHub Actions 云端定时
# 触发（北京时间）：每天 06:20 推当天课程 / 每天 20:00 推次日课程
# 目标群：私人订制消息--仔仔京汉（f718c04a）
# ============================================================
name: 京汉九年级4班每日课程提醒

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "today=当天课程 / next=次日课程"
        type: choice
        options: [today, next]
        default: today
      date:
        description: "模拟基准日期 YYYY-MM-DD（留空=真实今天）"
        required: false
        default: ""

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 推送课程提醒（cron-job.org 外部触发）
        env:
          TZ: Asia/Shanghai
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python3 jh9_reminder.py --mode ${{ inputs.mode }} --date "${{ inputs.date }}"
          else
            python3 jh9_reminder.py --mode ${{ inputs.mode }}
          fi
