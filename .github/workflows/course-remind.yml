# ============================================================
# 燕山大学 设计学类26-2 每日课程提醒 - GitHub Actions 云端定时配置
# 触发：
#   每天早上 07:00(北京) 推送当天课程   -> cron UTC 0 23 * * *
#   每天晚上 19:00(北京) 推送第二天课程 -> cron UTC 0 11 * * *
# 推送对象：企业微信机器人（私人定制群）
# 数据：course_reminder.py（内嵌 2026-2027 秋季学期完整排课）
# 用法：放置于仓库 .github/workflows/ 目录
# ============================================================
name: 课程每日提醒

on:
  workflow_dispatch:
    inputs:
      mode:
        description: today=当天课程 / tomorrow=明天课程
        required: true
        default: today
        type: choice
        options:
          - today
          - tomorrow

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 推送课程提醒（cron-job.org 外部触发）
        env:
          TZ: Asia/Shanghai
        run: python3 course_reminder.py --mode ${{ inputs.mode }}
