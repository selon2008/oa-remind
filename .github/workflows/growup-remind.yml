# ============================================================
# 巨人培优·国庆上课安排 到点提醒
# 北京 20:00：10/6 提醒明天上周日班课；10/9 提醒后天上周日班课
# 北京 06:20：10/10 提醒今天公立学校补课
# 目标群：私人订制消息--仔仔京汉（f718c04a）
# ============================================================
name: 巨人培优国庆上课安排提醒

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "evening=晚8点档 / morning=早6点20档"
        type: choice
        options: [evening, morning]
        default: evening
      date:
        description: "模拟日期 YYYY-MM-DD（留空=今天）"
        required: false
        default: ""

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 推送上课安排提醒（cron-job.org 外部触发）
        env:
          TZ: Asia/Shanghai
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python3 growup_reminder.py --mode ${{ inputs.mode }} --date "${{ inputs.date }}"
          else
            python3 growup_reminder.py --mode ${{ inputs.mode }}
          fi
