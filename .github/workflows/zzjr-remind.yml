# ============================================================
# 仔仔(李思远)周日捷豹秋季课 + 武汉天气 提醒 - GitHub Actions 云端定时配置
# 触发（北京时间）：
#   周六 20:30 -> 推送第二天(周日)课程 + 周日武汉天气
#   周日 08:30 -> 推送当天(周日)课程 + 当天武汉天气
#   周日 16:30 -> 推送当天(周日)课程 + 当天武汉天气 + 到点接送提醒
# 推送对象：企业微信机器人（私人订制消息--仔仔京汉）
# 数据：zzjr_reminder.py（内嵌周日固定三节课表）
# ============================================================
name: 仔仔周日课表天气提醒

on:
  workflow_dispatch:
    inputs:
      mode:
        description: saturday=周六晚 / sunday_morning=周日上午 / sunday_lunch=周日中午 / sunday_class_start=周日下午上课 / sunday_afternoon=周日下午
        required: true
        default: sunday_morning
        type: choice
        options:
          - saturday
          - sunday_morning
          - sunday_lunch
          - sunday_class_start
          - sunday_afternoon

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 推送课表天气提醒（cron-job.org 外部触发）
        env:
          TZ: Asia/Shanghai
        run: python3 zzjr_reminder.py --mode ${{ inputs.mode }}
